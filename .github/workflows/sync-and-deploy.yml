name: Trial first-tier Markdown refresh

on:
  workflow_dispatch:
    inputs:
      research_call_limit:
        description: "Maximum Paratera draft calls in this trial run"
        required: false
        default: "3"
        type: string

permissions:
  contents: write

concurrency:
  group: trial-first-tier-md
  cancel-in-progress: false

jobs:
  refresh-trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set trial date cutoff
        run: echo "RESEARCH_THROUGH_DATE=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_ENV"
      - name: Generate sourced trial Markdown
        env:
          PARATERA_API_KEY: ${{ secrets.PARATERA_API_KEY }}
          PARATERA_BASE_URL: ${{ secrets.PARATERA_BASE_URL }}
          PARATERA_MODEL: ${{ secrets.PARATERA_MODEL }}
          RESEARCH_CALL_LIMIT: ${{ inputs.research_call_limit || '3' }}
          RESEARCH_FROM_DATE: "2026-01-01"
          RESEARCH_FAIL_ON_ERROR: "0"
        run: python trial/refresh_trial_assets.py
      - name: Validate trial research
        run: python -m unittest discover -s trial/tests -v
      - name: Commit trial assets on this branch
        run: |
          git config user.name "mag7-trial-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trial/research trial/source-packets trial/research-index.json trial/research-coverage.md trial/v13-based/data/research_index.json trial/v13-based/data/research-coverage.md trial/v13-based/data/source_packet_coverage.json trial/v13-based/research trial/v13-based/source-packets trial/v13-based/calendar.html trial/v13-based/trial-offline.html
          git diff --cached --quiet || git commit -m "trial: refresh first-tier Markdown"
          git push origin HEAD:${{ github.ref_name }}
      - name: Report generation errors after saving drafts
        run: python -c "import json,sys; errors=json.load(open('trial/research-index.json',encoding='utf-8'))['errors']; print('generation errors:',json.dumps(errors,ensure_ascii=False)); sys.exit(bool(errors))"
