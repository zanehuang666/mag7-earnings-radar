name: Sync earnings and deploy Pages

on:
  workflow_dispatch:
    inputs:
      refresh_research:
        description: "Regenerate the three Microsoft research narratives with Paratera"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
  schedule:
    - cron: "37 1 * * 1-5"
    - cron: "37 13 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-test-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh deterministic earnings calendar
        run: python backend/sync_mag7_calendar.py
      - name: Refresh keyless QQQ market snapshot
        run: python backend/sync_market_data.py
      - name: Refresh Microsoft source-grounded research when due
        env:
          PARATERA_API_KEY: ${{ secrets.PARATERA_API_KEY }}
          PARATERA_BASE_URL: ${{ secrets.PARATERA_BASE_URL }}
          PARATERA_MODEL: ${{ secrets.PARATERA_MODEL }}
          MSFT_RESEARCH_FORCE: ${{ inputs.refresh_research || 'false' }}
        run: python backend/sync_msft_research.py
      - name: Run contract tests
        run: python -m unittest discover -s tests -v
      - name: Commit refreshed public data
        run: |
          git config user.name "mag7-calendar-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data/
          git diff --cached --quiet || git commit -m "data: refresh earnings snapshot"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
