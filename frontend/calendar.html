<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mag 7 财报日历</title><style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#17221c;--muted:#68736c;--line:#dce3dd;--green:#087052;--blue:#173f59;--soft:#e8f3ee;--amber:#b87513}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.shell{max-width:1280px;margin:auto;padding:22px}.top,.between,.modebar,.tabs,.legend,.event-head{display:flex;align-items:center;gap:10px}.top,.between{justify-content:space-between}.brand{display:flex;gap:12px;align-items:center}.logo{width:43px;height:43px;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--green));display:grid;place-items:center;color:#fff;font-weight:900}.brand h1,.brand p{margin:0}.brand h1{font-size:18px}.muted,.brand p{color:var(--muted);font-size:12px}.badge{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:11px;font-weight:800}.hero{margin-top:16px;padding:24px 28px;border-radius:18px;background:linear-gradient(135deg,var(--blue),var(--green));color:#fff}.hero h2{font-size:30px;line-height:1.12;letter-spacing:-.03em;margin:7px 0}.hero p{margin:0;max-width:850px;color:#dce9e4}.modebar{margin:14px 0;justify-content:space-between;flex-wrap:wrap}.segmented{display:flex;background:#e4e9e5;padding:3px;border-radius:11px}.mode{border:0;background:transparent;padding:8px 13px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:700}.mode.active{background:#fff;color:var(--ink);box-shadow:0 2px 9px #14281c12}.simulate{border:0;border-radius:10px;padding:10px 15px;background:var(--ink);color:#fff;cursor:pointer;font-weight:800}.simulate:hover{background:var(--green)}.layout{display:grid;grid-template-columns:1.08fr .92fr;gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 14px 38px rgba(27,50,38,.07)}.calendar-head{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;margin-bottom:12px}.calendar-head h2{text-align:center;margin:0;font-size:18px}.nav{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px;cursor:pointer}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week div{text-align:center;color:var(--muted);font-size:11px;padding:4px}.day{min-height:92px;border:1px solid var(--line);border-radius:10px;padding:7px;background:#fbfcfb}.day.out{opacity:.35}.day.today{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}.daynum{font-size:11px;color:var(--muted)}.earnings{display:block;width:100%;margin-top:5px;border:0;border-radius:7px;padding:5px 6px;text-align:left;color:#fff;font-size:11px;font-weight:800;cursor:pointer;background:var(--green)}.earnings.selected{outline:3px solid #8fc6b2}.earnings.preview{background:var(--blue)}.earnings.release{background:var(--amber)}.legend{margin-top:12px;flex-wrap:wrap;color:var(--muted);font-size:11px}.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}.empty{padding:48px 20px;text-align:center;background:#fafbfa;border:1px dashed var(--line);border-radius:12px}.empty strong{display:block;font-size:18px;margin-bottom:6px}.company-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.company{border:1px solid var(--line);background:#fff;padding:6px 9px;border-radius:9px;font-weight:800;font-size:11px}.panel{min-height:600px}.stage{padding:11px 13px;border-radius:10px;background:#f1f4f2;margin:12px 0}.stage strong{display:block}.stage.preview{background:#eaf1f6;color:var(--blue)}.stage.aftercheck{background:var(--soft);color:var(--green)}.stage.release{background:#fff1d9;color:#845409}.event-head h2{margin:0;font-size:25px}.event-head{justify-content:space-between;align-items:flex-start}.ticker{font-size:12px;font-weight:900;color:var(--green)}.tabs{border-bottom:1px solid var(--line);margin:15px 0 12px}.tab{border:0;background:transparent;padding:9px 2px;margin-right:15px;cursor:pointer;color:var(--muted);font-weight:800;border-bottom:2px solid transparent}.tab.active{color:var(--ink);border-color:var(--green)}.verdict{padding:12px;border-radius:10px;background:var(--soft);color:var(--green);font-weight:800}.panel h3{font-size:12px;margin:17px 0 6px;text-transform:uppercase;letter-spacing:.05em}.panel ul{padding-left:19px;margin:0}.panel li{margin:6px 0}.source{display:inline-block;color:var(--green);margin-top:15px}.notice{padding:12px;border-left:3px solid var(--amber);background:#fff8ec;color:#765421;font-size:12px;margin-bottom:13px}.foot{font-size:11px;color:var(--muted);padding:18px 2px}.hidden{display:none!important}@media(max-width:920px){.layout{grid-template-columns:1fr}.panel{min-height:0}}@media(max-width:620px){.shell{padding:10px}.hero{padding:20px}.hero h2{font-size:25px}.day{min-height:70px;padding:4px}.earnings{font-size:9px;padding:4px}.simulate{width:100%}}
</style></head><body><main class="shell">
<header class="top"><div class="brand"><div class="logo">M7</div><div><h1>Mag 7 Earnings Radar</h1><p>可审计财报日历 · Preview · Aftercheck</p></div></div><span class="badge" id="loadState">LOADING</span></header>
<section class="hero"><small>EARNINGS CONTROL ROOM</small><h2>从日历进入每一次财报判断。</h2><p>正式模式只接受已确认日期；历史验证模式通过模拟时间展示财报前预期、发布节点与财报后复盘。</p></section>
<section class="modebar"><div class="segmented"><button class="mode" data-mode="formal">正式追踪</button><button class="mode active" data-mode="replay">历史验证</button></div><button class="simulate" id="simulate">▶ 推进模拟时间</button></section><div class="notice" id="message"></div>
<section class="layout"><article class="card"><div class="calendar-head"><button class="nav" id="prevMonth">‹</button><h2 id="monthTitle"></h2><button class="nav" id="nextMonth">›</button></div><div class="week"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div><div class="days" id="days"></div><div class="legend"><span><i style="background:var(--blue)"></i> 财报前</span><span><i style="background:var(--amber)"></i> 发布日</span><span><i style="background:var(--green)"></i> 已发布</span><span id="clock"></span></div><div class="company-row" id="companies"></div></article>
<article class="card panel"><div id="emptyPanel" class="empty"><strong>点击日历中的公司</strong><span class="muted">查看该次财报的 Preview 与 Aftercheck</span></div><div id="eventPanel" class="hidden"><div class="event-head"><div><span class="ticker" id="ticker"></span><h2 id="company"></h2><div class="muted" id="period"></div></div><span class="badge" id="eventDate"></span></div><div class="stage" id="stage"></div><div class="tabs"><button class="tab active" data-kind="preview">Preview</button><button class="tab" data-kind="aftercheck">Aftercheck</button></div><div class="verdict" id="verdict"></div><p id="summary"></p><h3>关键观察</h3><ul id="points"></ul><h3>风险与边界</h3><ul id="risks"></ul><a class="source" id="source" target="_blank" rel="noopener">查看公司 IR 来源 ↗</a></div></article></section><div class="foot">历史卡片用于流程验证，不构成完整市场一致预期或投资建议。</div></main>
<script>
const $=id=>document.getElementById(id);let DATA,mode='replay',view=new Date('2024-10-01T00:00:00'),simDate='2024-10-22',selected=null,kind='preview';const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const dateOnly=s=>new Date(`${s}T00:00:00`);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const events=()=>DATA.calendar[mode].events||[];function stageFor(e){if(mode==='formal')return e.status;if(simDate<e.date)return'preview';if(simDate===e.date)return'release';return'aftercheck'}
function renderCalendar(){const y=view.getFullYear(),m=view.getMonth();$('monthTitle').textContent=`${y} 年 ${m+1} 月`;const start=new Date(y,m,1),offset=(start.getDay()+6)%7,gridStart=new Date(y,m,1-offset),items=[];for(let i=0;i<42;i++){const d=new Date(gridStart);d.setDate(gridStart.getDate()+i);const key=iso(d),dayEvents=events().filter(e=>e.date===key),out=d.getMonth()!==m,today=mode==='replay'&&key===simDate;const buttons=dayEvents.map(e=>`<button class="earnings ${stageFor(e)} ${selected&&selected.id===e.id?'selected':''}" data-id="${esc(e.id)}">${esc(e.ticker)} · ${stageFor(e)==='preview'?'预告':stageFor(e)==='release'?'发布':'复盘'}</button>`).join('');items.push(`<div class="day ${out?'out':''} ${today?'today':''}"><span class="daynum">${d.getDate()}</span>${buttons}</div>`)}$('days').innerHTML=items.join('');document.querySelectorAll('.earnings').forEach(b=>b.onclick=()=>selectEvent(b.dataset.id));$('clock').textContent=mode==='replay'?`模拟时间：${simDate}`:`更新时间：${DATA.calendar.formal.as_of}`}
function renderMode(){document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('simulate').classList.toggle('hidden',mode!=='replay');$('message').textContent=DATA.calendar[mode].message;if(mode==='replay')view=dateOnly(DATA.calendar.replay.month+'-01');else view=new Date();selected=null;$('eventPanel').classList.add('hidden');$('emptyPanel').classList.remove('hidden');if(mode==='formal'&&!events().length){$('days').innerHTML='<div class="empty" style="grid-column:1/-1"><strong>尚无已确认的未来日期</strong><span class="muted">系统不会把未经 IR 确认的预计日期伪装成正式事件。</span></div>';$('monthTitle').textContent='未来财报日历';$('clock').textContent=`更新时间：${DATA.calendar.formal.as_of}`}else renderCalendar()}
function selectEvent(id){selected=events().find(e=>e.id===id);if(!selected)return;kind=stageFor(selected)==='aftercheck'?'aftercheck':'preview';renderCalendar();renderPanel()}function renderPanel(){$('emptyPanel').classList.add('hidden');$('eventPanel').classList.remove('hidden');$('ticker').textContent=selected.ticker;$('company').textContent=selected.company;$('period').textContent=selected.fiscal_period;$('eventDate').textContent=selected.date;const s=stageFor(selected),labels={preview:'财报前：当前只能查看当时的 Preview',release:'发布日：结果已发布，Aftercheck 正在形成',aftercheck:'财报后：可对照 Preview 查看 Aftercheck'};$('stage').className=`stage ${s}`;$('stage').innerHTML=`<strong>${labels[s]||s}</strong><span>状态由日期与模拟时钟确定，不由模型判断。</span>`;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.kind===kind));const r=selected[kind];$('verdict').textContent=r.verdict;$('summary').textContent=r.summary;$('points').innerHTML=r.points.map(x=>`<li>${esc(x)}</li>`).join('');$('risks').innerHTML=r.risks.map(x=>`<li>${esc(x)}</li>`).join('');$('source').href=selected.source.url;$('source').textContent=`${selected.source.label} ↗`}
function advance(){const milestones=[...new Set(events().map(e=>e.date).concat(['2024-11-21']))].sort(),next=milestones.find(d=>d>simDate);simDate=next||'2024-10-22';view=dateOnly(simDate.slice(0,7)+'-01');renderCalendar();if(selected)renderPanel()}
fetch('./data/mag7.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}).then(d=>{DATA=d;$('loadState').textContent='READY · V2';$('companies').innerHTML=[...new Map(d.calendar.replay.events.map(e=>[e.ticker,e.company])).entries()].map(([t,c])=>`<span class="company">${esc(t)} · ${esc(c)}</span>`).join('');renderMode()}).catch(e=>{$('loadState').textContent='DATA ERROR';$('message').textContent=`数据载入失败：${e.message}`});document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;renderMode()});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{if(!selected)return;kind=b.dataset.kind;renderPanel()});$('simulate').onclick=advance;$('prevMonth').onclick=()=>{view.setMonth(view.getMonth()-1);renderCalendar()};$('nextMonth').onclick=()=>{view.setMonth(view.getMonth()+1);renderCalendar()};
</script></body></html>
