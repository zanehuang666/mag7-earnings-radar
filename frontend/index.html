<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=calendar.html"><title>Mag 7 Earnings Radar</title><style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#15221c;--muted:#68756e;--line:#dce4dd;--green:#08664a;--blue:#153f57;--soft:#e5f2ec;--amber:#a96b13}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:1180px;margin:auto;padding:24px}.top,.between,.tabs,.sources{display:flex;align-items:center;gap:10px}.top,.between{justify-content:space-between}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--green));display:grid;place-items:center;color:#fff;font-weight:800}.brand h1,.brand p{margin:0}.brand h1{font-size:18px}.brand p,.muted{color:var(--muted);font-size:12px}.badge{padding:6px 9px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:11px;font-weight:700}.hero{margin-top:18px;padding:30px;border-radius:19px;background:linear-gradient(135deg,var(--blue),var(--green));color:#fff}.hero h2{font-size:36px;line-height:1.08;letter-spacing:-.035em;margin:12px 0}.hero p{max-width:760px;color:#d9e7e1}.grid{display:grid;grid-template-columns:.82fr 1.18fr;gap:15px;margin-top:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 12px 35px #24362d0b}.next{padding:16px;border-radius:12px;background:#fff5e3;color:#80520e;margin-top:15px}.next strong{display:block;font-size:18px}.timeline{margin-top:18px}.event{display:grid;grid-template-columns:14px 1fr auto;gap:12px;position:relative;padding-bottom:20px}.event:before{content:"";position:absolute;left:6px;top:15px;bottom:0;width:1px;background:var(--line)}.event:last-child:before{display:none}.dot{width:13px;height:13px;border-radius:50%;background:var(--green);margin-top:4px}.event strong{display:block}.event time{color:var(--muted);font-size:12px}.tab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 12px;cursor:pointer}.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}.report{min-height:430px}.report h2{font-size:24px;line-height:1.2;margin:8px 0}.verdict{padding:12px;border-radius:11px;background:var(--soft);color:var(--green);font-weight:700;margin:15px 0}.report h3{font-size:13px;margin:18px 0 7px}.report ul{margin:0;padding-left:19px}.report li{margin:6px 0}.sources{flex-wrap:wrap;margin-top:18px}.sources a{color:var(--green);font-size:12px}.foot{color:var(--muted);font-size:11px;padding:18px 2px}@media(max-width:820px){.grid{grid-template-columns:1fr}.shell{padding:12px}.hero h2{font-size:28px}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><div class="logo">M7</div><div><h1>Mag 7 Earnings Radar</h1><p>Microsoft end-to-end demo</p></div></div><span class="badge" id="mode">LOADING</span></header><section class="hero"><small>EARNINGS CONTROL ROOM</small><h2>正式日历追踪未来，历史模式验证流程。</h2><p>公司IR负责事实，确定性逻辑负责状态，Paratera负责研究归纳。所有结果显示来源、模式和更新时间。</p></section><section class="grid"><article class="card"><div class="between"><div><b>Microsoft 财报日历</b><div class="muted" id="updated"></div></div><span class="badge">MSFT</span></div><div class="next"><span>FY27 Q1 · 下一次财报</span><strong id="nextDate">读取中…</strong><small id="nextStatus"></small></div><div class="timeline" id="timeline"></div><div class="sources" id="calendarSources"></div></article><article class="card report"><div class="between"><div class="tabs"><button class="tab active" data-kind="preview">Preview</button><button class="tab" data-kind="aftercheck">Aftercheck</button></div><span class="badge" id="researchMode"></span></div><small class="muted">历史验证 · FY26 Q2 · 2026-01-28</small><h2 id="title"></h2><div class="verdict" id="verdict"></div><p id="summary"></p><h3>关键判断</h3><ul id="points"></ul><h3>风险与边界</h3><ul id="risks"></ul></article></section><div class="foot">Research demo only · Not investment advice</div></main><script>
let DATA;const $=x=>document.getElementById(x);function research(kind){const r=DATA.demo[kind],d=r.data;$('researchMode').textContent=(r.mode||'unknown').toUpperCase();$('title').textContent=d.title;$('verdict').textContent=d.verdict;$('summary').textContent=d.summary;$('points').innerHTML=d.points.map(x=>`<li>${x}</li>`).join('');$('risks').innerHTML=d.risks.map(x=>`<li>${x}</li>`).join('')}fetch('./data/microsoft.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{DATA=d;$('mode').textContent='FORMAL + DEMO';$('updated').textContent='更新 '+d.generated_at;$('nextDate').textContent=d.formal.next_event.date||'待官方公布';$('nextStatus').textContent=d.formal.next_event.message;$('timeline').innerHTML=d.formal.history.slice().reverse().map(x=>`<div class="event"><span class="dot"></span><div><strong>${x.period}</strong><time>${x.status}</time></div><time>${x.date}</time></div>`).join('');$('calendarSources').innerHTML=d.sources.map(x=>`<a href="${x.url}" target="_blank" rel="noopener">${x.label} ↗</a>`).join('');research('preview')}).catch(e=>{$('mode').textContent='DATA ERROR';$('nextDate').textContent='数据载入失败';$('nextStatus').textContent=e.message});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');research(b.dataset.kind)});
</script></body></html>
